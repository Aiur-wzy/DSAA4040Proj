services:
  db:
    image: postgres:16
    container_name: bookstore-db
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: bookstore-backend:latest
    build: ./backend
    container_name: bookstore-backend
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: bookstore
      DB_USER: bookstore
      DB_PASSWORD: bookstore123
      APP_USER_ID: demo-user
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases:
          - backend-service

  frontend:
    image: bookstore-frontend:latest
    build: ./frontend
    container_name: bookstore-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres-data:
