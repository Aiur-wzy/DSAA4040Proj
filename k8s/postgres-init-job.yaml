apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  namespace: bookstore
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: postgres-init
          image: postgres:16
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookstore-secret
                  key: DB_PASSWORD
          envFrom:
            - configMapRef:
                name: bookstore-config
          command:
            - /bin/sh
            - -c
            - |
              set -e
              DB_TARGET_HOST="${DB_WRITE_HOST:-${DB_HOST:-postgres-service}}"
              DB_TARGET_PORT="${DB_PORT:-5432}"
              DB_TARGET_NAME="${DB_NAME:-bookstore}"
              DB_TARGET_USER="${DB_USER:-bookstore}"

              echo "Waiting for ${DB_TARGET_HOST}:${DB_TARGET_PORT}..."
              until pg_isready -h "${DB_TARGET_HOST}" -p "${DB_TARGET_PORT}" -U "${DB_TARGET_USER}"; do
                sleep 2
              done

              echo "Running schema initialization..."
              psql -h "${DB_TARGET_HOST}" -p "${DB_TARGET_PORT}" -U "${DB_TARGET_USER}" -d "${DB_TARGET_NAME}" -f /init-sql/01-schema.sql

              echo "Running seed data initialization..."
              psql -h "${DB_TARGET_HOST}" -p "${DB_TARGET_PORT}" -U "${DB_TARGET_USER}" -d "${DB_TARGET_NAME}" -f /init-sql/02-seed.sql

              echo "PostgreSQL initialization completed."
          volumeMounts:
            - name: init-sql
              mountPath: /init-sql
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
