apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-backend
  namespace: bookstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-backend
  template:
    metadata:
      labels:
        app: monitoring-backend
    spec:
      serviceAccountName: bookstore-monitoring-backend
      containers:
        - name: backend
          image: bookstore-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: BACKEND_MODE
              value: monitoring
            - name: BOOKSTORE_BACKEND_DEPLOYMENT
              value: public-backend
            - name: BOOKSTORE_BACKEND_HPA
              value: public-backend-hpa
            - name: BOOKSTORE_BACKEND_POD_SELECTOR
              value: app=public-backend
          envFrom:
            - configMapRef:
                name: bookstore-config
            - secretRef:
                name: bookstore-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
