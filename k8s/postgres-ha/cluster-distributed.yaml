apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bookstore-postgres
  namespace: bookstore
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  # Prefer one PostgreSQL instance per Kubernetes node for distributed-system
  # evidence. This stays a preference rather than a hard requirement so the
  # same DB_MODE=ha manifest still starts on single-node or resource-limited
  # Minikube. Ideal evidence is 3 PostgreSQL pods on 3 nodes; 2+ distinct
  # nodes is acceptable when local resources constrain scheduling.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  bootstrap:
    initdb:
      database: bookstore
      owner: bookstore
      secret:
        name: bookstore-postgres-app

  storage:
    storageClass: bookstore-cnpg-local
    size: 2Gi
    resizeInUseVolumes: false

  monitoring:
    enablePodMonitor: false

  postgresql:
    parameters:
      shared_buffers: 128MB
      max_connections: "100"
